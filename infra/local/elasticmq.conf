include classpath("application.conf")

node-address.host = "*"
aws.region = "us-east-1"
messages-storage.enabled = true

queues {
  execucao-comandos {
    defaultVisibilityTimeout = 30 seconds
    deadLettersQueue { name = "execucao-comandos-dlq", maxReceiveCount = 5 }
  }
  ordens-eventos {
    defaultVisibilityTimeout = 30 seconds
    deadLettersQueue { name = "ordens-eventos-dlq", maxReceiveCount = 5 }
  }
  execucao-comandos-dlq {}
  ordens-eventos-dlq {}
}
