name: oficina-fase4-integracao

services:
  pagamento-mock-permissoes:
    image: mcr.microsoft.com/dotnet/aspnet:10.0
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown $$APP_UID:$$APP_UID /data"]
    volumes: ["pagamento_mock:/data"]

  pagamento-mock:
    build:
      context: ${COBRANCA_PATH:-../oficina-mecanica-cobranca}
      dockerfile: tools/OficinaMecanica.PagamentoMock/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Mock__ConnectionString: Data Source=/data/pagamentos.db;Default Timeout=5
      Mock__Resultado: ${PAGAMENTO_MOCK_RESULTADO:-approved}
      Mock__ResultadoEstorno: ${PAGAMENTO_MOCK_ESTORNO_RESULTADO:-refunded}
      Mock__ClientId: oficina-local
      Mock__ClientSecret: segredo-do-mock-somente-local
    ports: ["127.0.0.1:18094:8080"]
    volumes: ["pagamento_mock:/data"]
    depends_on:
      pagamento-mock-permissoes: { condition: service_completed_successfully }

  mysql-cobranca:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: cobranca
      MYSQL_USER: cobranca_app
      MYSQL_PASSWORD: LocalCobrancaSaga123
      MYSQL_ROOT_PASSWORD: LocalRootCobrancaSaga123
    ports: ["127.0.0.1:3310:3306"]
    volumes: ["cobranca_integracao:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u$$MYSQL_USER $$MYSQL_DATABASE -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30

  cobranca:
    build:
      context: ${COBRANCA_PATH:-../oficina-mecanica-cobranca}
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      OrdensAtendimento__Enabled: "true"
      OrdensAtendimento__SecretKey: ${ORDENS_COBRANCA_SECRET:-chave-exclusiva-da-integracao-ordens-cobranca-local-1234567890}
      ConnectionStrings__DefaultConnection: Server=mysql-cobranca;Database=cobranca;User=cobranca_app;Password=LocalCobrancaSaga123
      PagamentoMock__Enabled: "true"
      PagamentoMock__BaseUrl: http://pagamento-mock:8080/
      PagamentoMock__ClientId: oficina-local
      PagamentoMock__ClientSecret: segredo-do-mock-somente-local
      PagamentoMock__IntervaloRetentativaSegundos: "2"
      PagamentoMock__MaxTentativas: "3"
      Database__ApplyMigrations: "true"
      JwtSettings__SecretKey: chave-local-da-integracao-fase4-1234567890
      AdminUserSettings__Username: admin
      AdminUserSettings__Password: LocalAdminSaga123
      Messaging__Enabled: "true"
      Messaging__Endpoint: http://elasticmq:9324
    ports: ["127.0.0.1:18093:8080"]
    depends_on:
      mysql-cobranca: { condition: service_healthy }
      pagamento-mock: { condition: service_started }
      elasticmq: { condition: service_started }

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ordens
      MYSQL_USER: ordens_app
      MYSQL_PASSWORD: LocalOrdensSaga123
      MYSQL_ROOT_PASSWORD: LocalRootSaga123
    ports: ["127.0.0.1:3309:3306"]
    volumes: ["ordens_integracao:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u$$MYSQL_USER $$MYSQL_DATABASE -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30

  mongo-keyfile:
    image: mongo:8.0
    user: "0:0"
    entrypoint: ["/bin/bash", "/scripts/mongo-keyfile.sh"]
    volumes:
      - mongo_keys:/keys
      - ${EXECUCAO_PATH:-../oficina-mecanica-execucao}/infra/local/mongo-keyfile.sh:/scripts/mongo-keyfile.sh:ro

  mongo:
    image: mongo:8.0
    command: ["--replSet", "rs0", "--bind_ip_all", "--keyFile", "/keys/mongo-keyfile"]
    depends_on:
      mongo-keyfile: { condition: service_completed_successfully }
    environment:
      MONGO_INITDB_ROOT_USERNAME: execucao_root
      MONGO_INITDB_ROOT_PASSWORD: LocalMongoSaga123
      MONGO_INITDB_DATABASE: execucao
      MONGO_DATABASE: execucao
      MONGO_USERNAME: execucao_app
      MONGO_PASSWORD: LocalExecucaoSaga123
    ports: ["127.0.0.1:27019:27017"]
    volumes:
      - execucao_integracao:/data/db
      - mongo_keys:/keys:ro
      - ${EXECUCAO_PATH:-../oficina-mecanica-execucao}/infra/local/mongo-init.js:/docker-entrypoint-initdb.d/01-execucao.js:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet -u $$MONGO_INITDB_ROOT_USERNAME -p $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval 'db.adminCommand({ping:1}).ok'"]
      interval: 5s
      timeout: 5s
      retries: 30

  mongo-replica-init:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: execucao_root
      MONGO_INITDB_ROOT_PASSWORD: LocalMongoSaga123
    entrypoint: ["/bin/bash", "-c"]
    command: ['exec mongosh --quiet --host mongo --username "$$MONGO_INITDB_ROOT_USERNAME" --password "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin /scripts/mongo-replica-init.js']
    volumes:
      - ${EXECUCAO_PATH:-../oficina-mecanica-execucao}/infra/local/mongo-replica-init.js:/scripts/mongo-replica-init.js:ro
    depends_on:
      mongo: { condition: service_healthy }

  filas-permissoes:
    image: softwaremill/elasticmq:1.7.1
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown 999:999 /data"]
    volumes: ["filas_integracao:/data"]

  elasticmq:
    image: softwaremill/elasticmq:1.7.1
    ports: ["127.0.0.1:9324:9324"]
    volumes:
      - ./infra/local/elasticmq.conf:/opt/elasticmq.conf:ro
      - filas_integracao:/data
    depends_on:
      filas-permissoes: { condition: service_completed_successfully }

  ordens:
    build: .
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      OrcamentoCliente__Enabled: "true"
      OrcamentoCliente__BaseUrl: http://cobranca:8080/
      OrcamentoCliente__SecretKey: ${ORDENS_COBRANCA_SECRET:-chave-exclusiva-da-integracao-ordens-cobranca-local-1234567890}
      ConnectionStrings__DefaultConnection: Server=mysql;Database=ordens;User=ordens_app;Password=LocalOrdensSaga123
      Database__ApplyMigrations: "true"
      JwtSettings__SecretKey: chave-local-da-integracao-fase4-1234567890
      AdminUserSettings__Username: admin
      AdminUserSettings__Password: LocalAdminSaga123
      Messaging__Enabled: "true"
      Messaging__Endpoint: http://elasticmq:9324
    ports: ["127.0.0.1:18091:8080"]
    depends_on:
      mysql: { condition: service_healthy }
      elasticmq: { condition: service_started }

  execucao:
    build:
      context: ${EXECUCAO_PATH:-../oficina-mecanica-execucao}
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      MongoSettings__ConnectionString: mongodb://execucao_app:LocalExecucaoSaga123@mongo:27017/execucao?authSource=execucao&replicaSet=rs0&directConnection=true
      MongoSettings__DatabaseName: execucao
      JwtSettings__SecretKey: chave-local-da-integracao-fase4-1234567890
      AdminUserSettings__Username: admin
      AdminUserSettings__Password: LocalAdminSaga123
      Messaging__Enabled: "true"
      Messaging__Endpoint: http://elasticmq:9324
    ports: ["127.0.0.1:18092:8080"]
    depends_on:
      mongo-replica-init: { condition: service_completed_successfully }
      elasticmq: { condition: service_started }

volumes:
  mongo_keys:
  pagamento_mock:
  cobranca_integracao:
  ordens_integracao:
  execucao_integracao:
  filas_integracao:
