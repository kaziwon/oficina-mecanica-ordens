name: Integracao continua - Ordens

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore OficinaMecanica.Ordens.slnx
      - run: dotnet build OficinaMecanica.Ordens.slnx --configuration Release --no-restore

  test:
    name: Testes e cobertura
    runs-on: ubuntu-latest
    needs: build
    services:
      sqs:
        image: softwaremill/elasticmq:1.7.1
        ports: ["9324:9324"]
    env:
      SQS_TEST_ENDPOINT: http://127.0.0.1:9324
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore OficinaMecanica.Ordens.slnx
      - run: >-
          dotnet test OficinaMecanica.Ordens.slnx --configuration Release --no-restore
          --collect:"XPlat Code Coverage" --results-directory TestResults
      - name: Publicar relatorios de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-ordens
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn
