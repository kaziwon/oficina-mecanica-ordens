name: oficina-mecanica-ordens-fase4

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Informe MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER:?Informe MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Informe MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Informe MYSQL_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - ordens_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u$$MYSQL_USER $$MYSQL_DATABASE -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  api:
    build: .
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=mysql;Port=3306;Database=${MYSQL_DATABASE};User=${MYSQL_USER};Password=${MYSQL_PASSWORD}"
      JwtSettings__SecretKey: ${JWT_SECRET:?Informe JWT_SECRET}
      AdminUserSettings__Username: ${ADMIN_USERNAME:-admin}
      AdminUserSettings__Password: ${ADMIN_PASSWORD:?Informe ADMIN_PASSWORD}
      Database__ApplyMigrations: "true"
    ports:
      - "127.0.0.1:${API_PORT:-18081}:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  ordens_data:
